{% extends "base.html" %}
{% block title %}Books{% endblock %}

{% block content %}
<div x-data="addBookApp()" x-init="init()" class="max-w-2xl mx-auto space-y-6">

    <!-- ══ Add new book ══════════════════════════════════════════ -->
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl border border-slate-200 shadow-sm p-6">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.966 8.966 0 00-6 2.292m0-14.25v14.25"/>
                </svg>
            </div>
            <div>
                <h2 class="font-bold text-lg text-slate-900">Add Book to Catalog</h2>
                <p class="text-sm text-slate-400">Scan or enter the ISBN to auto-fill details.</p>
            </div>
        </div>

        <!-- Success banner -->
        <div x-show="successMsg"
             x-transition
             class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700 flex items-start gap-2">
            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
            </svg>
            <span x-text="successMsg"></span>
        </div>

        <!-- Error banner -->
        <div x-show="errorMsg"
             x-transition
             class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-sm text-rose-700"
             x-text="errorMsg">
        </div>

        <form @submit.prevent="submit()" class="space-y-4">

            <!-- ISBN / Barcode -->
            <div>
                <label for="isbn" class="block text-sm font-medium text-slate-700 mb-1">
                    ISBN / Barcode <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input id="isbn"
                           x-model="form.barcode"
                           @change="onIsbnChange()"
                           @keydown.enter.prevent="onIsbnChange()"
                           type="text"
                           inputmode="numeric"
                           placeholder="Scan or type ISBN-10, ISBN-13, or 14-digit barcode"
                           autocomplete="off"
                           class="w-full border border-slate-300 rounded-lg px-3 py-2.5 font-mono text-sm
                                  focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 pr-10" />
                    <!-- Lookup spinner -->
                    <div x-show="lookingUp"
                         class="absolute right-3 top-1/2 -translate-y-1/2">
                        <svg class="w-4 h-4 animate-spin text-indigo-400" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
                        </svg>
                    </div>
                </div>
                <!-- Lookup status chip -->
                <p class="text-xs mt-1"
                   :class="{
                       'text-emerald-600': lookupStatus === 'found',
                       'text-slate-400':   lookupStatus === 'not_found',
                       'text-amber-600':   lookupStatus === 'unavailable',
                       'text-slate-400':   !lookupStatus,
                   }">
                    <template x-if="lookupStatus === 'found'">
                        <span>&#10003; Book details found and auto-filled — review before saving.</span>
                    </template>
                    <template x-if="lookupStatus === 'not_found'">
                        <span>No metadata found for this ISBN — fill in details manually.</span>
                    </template>
                    <template x-if="lookupStatus === 'unavailable'">
                        <span>Metadata service unavailable — fill in details manually.</span>
                    </template>
                    <template x-if="!lookupStatus">
                        <span>ISBN-10 (10 digits), ISBN-13 (13 digits), or library barcode (14 digits).</span>
                    </template>
                </p>
            </div>

            <!-- Title -->
            <div>
                <label for="title" class="block text-sm font-medium text-slate-700 mb-1">
                    Title <span class="text-slate-400 font-normal">(optional)</span>
                </label>
                <input id="title"
                       x-model="form.title"
                       type="text"
                       placeholder="e.g. The Great Gatsby"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Author -->
            <div>
                <label for="author" class="block text-sm font-medium text-slate-700 mb-1">
                    Author <span class="text-slate-400 font-normal">(optional)</span>
                </label>
                <input id="author"
                       x-model="form.author"
                       type="text"
                       placeholder="e.g. F. Scott Fitzgerald"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Category -->
            <div>
                <label for="category" class="block text-sm font-medium text-slate-700 mb-1">
                    Category
                </label>
                <select id="category"
                        x-model="form.category"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                               focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                    <option value="book">Book</option>
                    <option value="dvd">DVD</option>
                    <option value="audiobook">Audiobook</option>
                    <option value="magazine">Magazine</option>
                    <option value="ebook">E-Book</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 pt-2">
                <a href="/"
                   class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm
                          font-medium hover:bg-slate-50 transition-colors text-center">
                    Cancel
                </a>
                <button type="submit"
                        :disabled="submitting || !form.barcode.trim()"
                        class="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium
                               hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed
                               transition-colors flex items-center justify-center gap-2">
                    <span x-show="submitting" class="spinner"></span>
                    <span x-text="submitting ? 'Saving…' : 'Add to Catalog'"></span>
                </button>
            </div>

        </form>
    </div>

    <!-- Add another prompt (shown after success) -->
    <div x-show="successMsg" x-transition class="text-center">
        <button @click="reset()"
                class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition-colors">
            + Add another item
        </button>
    </div>

    <!-- ══ Manage existing book ══════════════════════════════════ -->
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl border border-slate-200 shadow-sm p-6">

        <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
                </svg>
            </div>
            <div>
                <h2 class="font-bold text-lg text-slate-900">Manage Existing Book</h2>
                <p class="text-sm text-slate-400">Look up by barcode to return, archive, or reactivate.</p>
            </div>
        </div>

        <!-- Lookup -->
        <div class="flex gap-2 mb-4">
            <input x-model="manage.barcode"
                   @keydown.enter="lookupBook()"
                   type="text"
                   inputmode="numeric"
                   placeholder="Scan or enter barcode"
                   class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 font-mono text-sm
                          focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <button @click="lookupBook()"
                    :disabled="manage.loading"
                    class="bg-slate-700 text-white px-5 rounded-lg hover:bg-slate-800 font-medium text-sm
                           transition-colors flex items-center gap-2 disabled:opacity-50">
                <span x-show="manage.loading" class="spinner"></span>
                <span>Look Up</span>
            </button>
        </div>

        <!-- Error -->
        <div x-show="manage.error"
             x-transition
             class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-sm text-rose-700"
             x-text="manage.error">
        </div>

        <!-- Success -->
        <div x-show="manage.success"
             x-transition
             class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700"
             x-text="manage.success">
        </div>

        <!-- Book detail card -->
        <template x-if="manage.book">
            <div class="border border-slate-200 rounded-xl p-4">

                <!-- Book info -->
                <div class="flex items-start justify-between gap-4 mb-4">
                    <div>
                        <h3 class="font-semibold text-slate-900"
                            x-text="manage.book.title || '(untitled)'"></h3>
                        <p class="text-xs text-slate-500 font-mono mt-0.5"
                           x-text="manage.book.barcode"></p>
                        <p x-show="manage.book.author"
                           class="text-sm text-slate-500 mt-1"
                           x-text="manage.book.author"></p>
                    </div>
                    <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
                        <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                              :class="manage.book.is_active
                                  ? 'bg-emerald-100 text-emerald-700'
                                  : 'bg-slate-200 text-slate-500'"
                              x-text="manage.book.is_active ? 'Active' : 'Archived'"></span>
                        <span x-show="manage.book.checked_out"
                              class="px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">
                            Checked out
                        </span>
                    </div>
                </div>

                <!-- Checked out info -->
                <div x-show="manage.book.checked_out"
                     class="bg-amber-50 border border-amber-100 rounded-lg p-3 mb-4 text-sm">
                    <p class="text-amber-800">
                        Checked out to <strong x-text="manage.book.checked_out_to"></strong>
                        <span class="text-xs font-mono text-amber-600 ml-1"
                              x-text="manage.book.checked_out_card"></span>
                    </p>
                    <p class="text-amber-600 text-xs mt-1"
                       x-text="manage.book.due_date ? 'Due: ' + manage.book.due_date.slice(0, 10) : ''"></p>
                </div>

                <!-- Action buttons -->
                <div class="flex flex-wrap gap-2">
                    <!-- Return -->
                    <button x-show="manage.book.checked_out"
                            @click="manageAction('return')"
                            :disabled="manage.acting"
                            class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium
                                   hover:bg-blue-700 disabled:opacity-50 transition-colors">
                        Return Item
                    </button>
                    <!-- Archive -->
                    <button x-show="manage.book.is_active && !manage.book.checked_out"
                            @click="manageAction('archive')"
                            :disabled="manage.acting"
                            class="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-medium
                                   hover:bg-rose-700 disabled:opacity-50 transition-colors">
                        Archive
                    </button>
                    <!-- Reactivate -->
                    <button x-show="!manage.book.is_active"
                            @click="manageAction('reactivate')"
                            :disabled="manage.acting"
                            class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium
                                   hover:bg-emerald-700 disabled:opacity-50 transition-colors">
                        Reactivate
                    </button>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function addBookApp() {
    return {
        // ── Add book state ─────────────────────────────────────
        form: {
            barcode:  '',
            title:    '',
            author:   '',
            category: 'book',
        },
        submitting:   false,
        lookingUp:    false,
        lookupStatus: '',   // '' | 'found' | 'not_found' | 'unavailable'
        errorMsg:     '',
        successMsg:   '',
        lastLookedUp: '',   // ISBN already fetched — skip duplicate lookups

        // ── Manage book state ──────────────────────────────────
        manage: {
            barcode: '',
            book:    null,
            loading: false,
            acting:  false,
            error:   '',
            success: '',
        },

        init() {
            this.$nextTick(() => document.getElementById('isbn')?.focus());
        },

        // ── Add book methods ───────────────────────────────────

        async onIsbnChange() {
            const isbn = this.form.barcode.trim();
            if (!isbn || isbn === this.lastLookedUp) return;
            if (!/^\d{10}$|^\d{13}$/.test(isbn)) return;  // only look up 10/13-digit ISBNs

            this.lastLookedUp = isbn;
            this.lookingUp    = true;
            this.lookupStatus = '';
            try {
                const r    = await fetch(`/api/books/lookup?isbn=${encodeURIComponent(isbn)}`);
                const data = await r.json();
                if (data.found) {
                    if (data.title)    this.form.title    = data.title;
                    if (data.author)   this.form.author   = data.author;
                    if (data.category) this.form.category = data.category;
                    this.lookupStatus = 'found';
                } else if (data.error === 'metadata service unavailable') {
                    this.lookupStatus = 'unavailable';
                } else {
                    this.lookupStatus = 'not_found';
                }
            } catch {
                this.lookupStatus = 'unavailable';
            } finally {
                this.lookingUp = false;
            }
        },

        async submit() {
            this.errorMsg   = '';
            this.successMsg = '';
            if (!this.form.barcode.trim()) {
                this.errorMsg = 'ISBN or barcode is required.';
                return;
            }
            this.submitting = true;
            try {
                const r = await fetch('/api/books/', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        barcode:  this.form.barcode.trim(),
                        title:    this.form.title.trim()    || null,
                        author:   this.form.author.trim()   || null,
                        category: this.form.category,
                    }),
                });
                const data = await r.json();
                if (!r.ok) {
                    this.errorMsg = data.error || 'Could not add the item.';
                    return;
                }
                const label = data.title ? `"${data.title}"` : `barcode ${data.barcode}`;
                this.successMsg = `Added ${label} to the catalog.`;
            } catch (e) {
                this.errorMsg = e.message;
            } finally {
                this.submitting = false;
            }
        },

        reset() {
            this.form         = { barcode: '', title: '', author: '', category: 'book' };
            this.successMsg   = '';
            this.errorMsg     = '';
            this.lookupStatus = '';
            this.lastLookedUp = '';
            this.$nextTick(() => document.getElementById('isbn')?.focus());
        },

        // ── Manage book methods ────────────────────────────────

        async lookupBook() {
            const bc = this.manage.barcode.trim();
            if (!bc) return;
            this.manage.loading = true;
            this.manage.error   = '';
            this.manage.success = '';
            this.manage.book    = null;
            try {
                const r = await fetch(`/api/books/${encodeURIComponent(bc)}`);
                const data = await r.json();
                if (!r.ok) {
                    this.manage.error = data.error || 'Book not found';
                    return;
                }
                this.manage.book = data;
            } catch (e) {
                this.manage.error = e.message;
            } finally {
                this.manage.loading = false;
            }
        },

        async manageAction(action) {
            const bc = this.manage.book?.barcode;
            if (!bc) return;
            this.manage.acting  = true;
            this.manage.error   = '';
            this.manage.success = '';

            let url, label;
            if (action === 'return') {
                url   = '/api/checkouts/return';
                label = 'Returned';
            } else if (action === 'archive') {
                url   = `/api/books/${encodeURIComponent(bc)}/archive`;
                label = 'Archived';
            } else {
                url   = `/api/books/${encodeURIComponent(bc)}/reactivate`;
                label = 'Reactivated';
            }

            try {
                const opts = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                };
                if (action === 'return') {
                    opts.body = JSON.stringify({ barcode: bc });
                }
                const r = await fetch(url, opts);
                const data = await r.json();
                if (!r.ok) {
                    this.manage.error = data.error || 'Action failed';
                    return;
                }
                this.manage.success = `${label}: ${bc}`;
                // Refresh book details
                await this.lookupBook();
            } catch (e) {
                this.manage.error = e.message;
            } finally {
                this.manage.acting = false;
            }
        },
    };
}
</script>
{% endblock %}
