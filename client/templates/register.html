{% extends "base.html" %}
{% block title %}Register Patron{% endblock %}

{% block content %}
<div x-data="registerApp()" x-init="init()" class="max-w-lg mx-auto">

    <div class="bg-white/90 backdrop-blur-sm rounded-2xl border border-slate-200 shadow-sm p-6">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                </svg>
            </div>
            <div>
                <h2 class="font-bold text-lg text-slate-900">Register New Patron</h2>
                <p class="text-sm text-slate-400">Fields marked <span class="text-rose-500">*</span> are required.</p>
            </div>
        </div>

        <!-- Error banner -->
        <div x-show="errorMsg"
             class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-sm text-rose-700"
             x-text="errorMsg">
        </div>

        <!-- Form -->
        <form @submit.prevent="submit()" class="space-y-4">

            <!-- Library card number -->
            <div>
                <label for="reg-card" class="block text-sm font-medium text-slate-700 mb-1">
                    Library Card Number <span class="text-rose-500">*</span>
                </label>
                <input id="reg-card"
                       x-model="form.card_number"
                       type="text"
                       inputmode="numeric"
                       placeholder="10 or 14 digits"
                       autocomplete="off"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 font-mono text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                       :class="cardPreFilled ? 'bg-slate-50' : ''" />
                <p class="text-xs text-slate-400 mt-1">Enter digits only — leading zeros are preserved.</p>
            </div>

            <!-- Name row: last / first -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="reg-last" class="block text-sm font-medium text-slate-700 mb-1">
                        Last Name <span class="text-rose-500">*</span>
                    </label>
                    <input id="reg-last"
                           x-model="form.last_name"
                           type="text"
                           placeholder="Smith"
                           class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                                  focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
                <div>
                    <label for="reg-first" class="block text-sm font-medium text-slate-700 mb-1">
                        First Name <span class="text-rose-500">*</span>
                    </label>
                    <input id="reg-first"
                           x-model="form.first_name"
                           type="text"
                           placeholder="Jane"
                           class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                                  focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
            </div>

            <!-- Middle name (optional) -->
            <div>
                <label for="reg-middle" class="block text-sm font-medium text-slate-700 mb-1">
                    Middle Name <span class="text-slate-400 font-normal">(optional)</span>
                </label>
                <input id="reg-middle"
                       x-model="form.middle_name"
                       type="text"
                       placeholder="Marie"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Birth date (required) -->
            <div>
                <label for="reg-dob" class="block text-sm font-medium text-slate-700 mb-1">
                    Date of Birth <span class="text-rose-500">*</span>
                </label>
                <input id="reg-dob"
                       x-model="form.birth_date"
                       type="date"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Email (optional) -->
            <div>
                <label for="reg-email" class="block text-sm font-medium text-slate-700 mb-1">
                    Email <span class="text-slate-400 font-normal">(optional)</span>
                </label>
                <input id="reg-email"
                       x-model="form.email"
                       type="email"
                       placeholder="jane.smith@example.com"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Phone (optional) -->
            <div>
                <label for="reg-phone" class="block text-sm font-medium text-slate-700 mb-1">
                    Phone <span class="text-slate-400 font-normal">(optional)</span>
                </label>
                <input id="reg-phone"
                       x-model="form.phone"
                       type="tel"
                       placeholder="(555) 123-4567"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                              focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <!-- Actions -->
            <div class="flex gap-3 pt-2">
                <a href="/"
                   class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm
                          font-medium hover:bg-slate-50 transition-colors text-center">
                    Cancel
                </a>
                <button type="submit"
                        :disabled="submitting"
                        class="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium
                               hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed
                               transition-colors flex items-center justify-center gap-2">
                    <span x-show="submitting" class="spinner"></span>
                    <span x-text="submitting ? 'Registering…' : 'Register Patron'"></span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
