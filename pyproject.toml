[project]
name = "library-checkout"
version = "0.1.0"
description = "Desktop library checkout system (Flask + pywebview)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JasmolSD" }]
license = { text = "MIT" }
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
desktop = [
    "pywebview>=5.0.0",
]
# Install when DATABASE_URL points at Postgres (e.g. Supabase, Neon, Railway).
# Not needed for the default SQLite setup.
postgres = [
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "pyinstaller>=6.0.0",
    "pyright>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]